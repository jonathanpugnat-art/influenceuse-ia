# Crons fréquents de production — pilotés par GitHub Actions au lieu de
# Vercel Cron : le plan Vercel Hobby limite les crons à 1 exécution/jour
# (une expression plus fréquente fait échouer le déploiement). Seul
# fetch-trends (quotidien) reste dans vercel.json.
#
# Les routes /api/cron/* sont protégées par `Authorization: Bearer CRON_SECRET`
# (secret GitHub `CRON_SECRET` = même valeur que la variable Vercel Production).
#
# Limites connues de GitHub Actions `schedule` :
#   - dérive possible de quelques minutes en période de charge — acceptable,
#     les routes sont idempotentes (claims atomiques) ;
#   - désactivation auto après 60 jours sans activité sur le repo.
name: Crons production

on:
  schedule:
    - cron: "*/5 * * * *" # publish + process-batches
    - cron: "*/10 * * * *" # retry-webhooks
    - cron: "0 * * * *" # fetch-analytics
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Toujours cibler www : l'apex renvoie un 307 vers www que curl (sans -L)
      # ne suit pas — le cron « réussissait » sans jamais exécuter la route.
      BASE_URL: https://www.aurainfluenceai.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Publish + process-batches + talking-head poll (toutes les 5 min)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        run: |
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/publish"
          echo
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/process-batches"
          echo
          curl -fsS --max-time 90  -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/poll-talking-head"

      - name: Retry webhooks (toutes les 10 min)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/retry-webhooks"

      - name: Fetch analytics (toutes les heures)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$BASE_URL/api/cron/fetch-analytics"
