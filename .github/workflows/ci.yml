name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    env:
      # Clerk validates the publishable key at build time — dummy values fail.
      # Add these three secrets in GitHub → Settings → Secrets and variables → Actions:
      #   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, ENCRYPTION_SECRET
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
      NEXT_PUBLIC_APP_URL: https://aurainfluenceai.com
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /fr/sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /fr/sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /fr/influencers
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /fr/influencers
      BETA_HIDE_PAYMENTS: "true"
      NEXT_PUBLIC_BETA_HIDE_PAYMENTS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
